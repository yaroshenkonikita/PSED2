spring.application.name=${SPRING_APPLICATION_NAME:rate-printer}
server.port=${SERVER_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}
spring.cloud.zookeeper.connect-string=${SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING:localhost:2181}
spring.cloud.zookeeper.discovery.register=${SPRING_CLOUD_ZOOKEEPER_DISCOVERY_REGISTER:false}
spring.cloud.zookeeper.discovery.root=/services
provider.url=${PROVIDER_URL:http://currency-rate-provider/api/v1/rpc}
poll.interval.ms=${POLL_INTERVAL_MS:5000}
poll.initial-delay.ms=${POLL_INITIAL_DELAY_MS:1000}
poll.pair=${POLL_PAIR:USD/RUB}
client.name=${CLIENT_NAME:${spring.application.name}}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles.http.client.requests=0.5,0.95,0.99
