global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: client
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - client:8081
        labels:
          application: rate-printer

  - job_name: service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - service:8080
        labels:
          application: currency-rate-provider
          instance_name: service

  - job_name: service2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - service2:8080
        labels:
          application: currency-rate-provider
          instance_name: service2

  - job_name: zookeeper
    metrics_path: /metrics
    static_configs:
      - targets:
          - zookeeper:7070
        labels:
          application: zookeeper
