spring.application.name=${SPRING_APPLICATION_NAME:currency-rate-provider}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}
spring.cloud.zookeeper.connect-string=${SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING:localhost:2181}
spring.cloud.zookeeper.discovery.register=${SPRING_CLOUD_ZOOKEEPER_DISCOVERY_REGISTER:true}
spring.cloud.zookeeper.discovery.root=/services
spring.cloud.zookeeper.discovery.instance-host=${SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST:localhost}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles.rpc.server.request.duration=0.5,0.95,0.99
