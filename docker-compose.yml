services:
  zookeeper:
    image: zookeeper:3.9
    container_name: psed2-zookeeper
    environment:
      ZOO_CFG_EXTRA: |
        metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
        metricsProvider.httpPort=7070
    ports:
      - "2181:2181"
      - "7070:7070"

  service:
    image: ${PROVIDER_IMAGE:-psed2/currency-rate-provider:local}
    build:
      context: ./currency-rate-provider
    container_name: psed2-service
    depends_on:
      - zookeeper
    stop_grace_period: 25s
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: currency-rate-provider
      SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: service
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "8080:8080"

  service2:
    image: ${PROVIDER_IMAGE:-psed2/currency-rate-provider:local}
    container_name: psed2-service2
    depends_on:
      - zookeeper
    stop_grace_period: 25s
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: currency-rate-provider
      SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: service2
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "8082:8080"

  client:
    image: ${CLIENT_IMAGE:-psed2/rate-printer:local}
    build:
      context: ./rate-printer
    container_name: psed2-client
    depends_on:
      zookeeper:
        condition: service_started
      service:
        condition: service_healthy
      service2:
        condition: service_healthy
    stop_grace_period: 25s
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: rate-printer
      CLIENT_NAME: rate-printer
      SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      PROVIDER_URL: http://currency-rate-provider/api/v1/rpc
      POLL_INITIAL_DELAY_MS: 3000
    ports:
      - "8081:8081"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: psed2-prometheus
    depends_on:
      - client
      - service
      - service2
      - zookeeper
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: psed2-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  pact-broker-db:
    image: postgres:16-alpine
    container_name: psed2-pact-broker-db
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 20

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: psed2-pact-broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: "postgres://pact_broker:pact_broker@pact-broker-db:5432/pact_broker"
      PACT_BROKER_LOG_LEVEL: INFO
    ports:
      - "9292:9292"
